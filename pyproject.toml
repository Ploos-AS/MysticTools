[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mystictools"
version = "0.1.0.dev0"
description = "Linux-first sysop toolkit for Mystic BBS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ploos AS"}]

[project.scripts]
mystictools = "mystictools.app:main"
mysticstatus = "mystictools.standalone:main"
mysticcheck = "mystictools.standalone:main"
mysticwho = "mystictools.standalone:main"
mysticnodes = "mystictools.standalone:main"
mysticwatch = "mystictools.watch_cli:main"
mysticlog = "mystictools.standalone:main"
mysticnet = "mystictools.standalone:main"
mysticfidonet = "mystictools.standalone:main"
mysticdoors = "mystictools.standalone:main"
mysticusers = "mystictools.standalone:main"
mysticstats = "mystictools.standalone:main"
mystichealth = "mystictools.standalone:main"
mysticdoctor = "mystictools.standalone:main"
mysticbackup = "mystictools.standalone:main"
mysticrestore = "mystictools.standalone:main"
mysticrollback = "mystictools.rollback_cli:main"
mysticmetrics = "mystictools.standalone:main"
mysticexporter = "mystictools.exporter_cli:main"

[tool.setuptools]
packages = ["mystictools"]
