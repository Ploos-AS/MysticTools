[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mystictools"
version = "0.1.0.dev0"
description = "Linux-first sysop toolkit for Mystic BBS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ploos AS"}]

[project.scripts]
mystictools = "mystictools.app:main"
mysticrollback = "mystictools.rollback_cli:main"

[tool.setuptools]
packages = ["mystictools"]
